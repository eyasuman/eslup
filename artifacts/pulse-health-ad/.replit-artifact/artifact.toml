kind = "video"
previewPath = "/pulse-health-ad/"
title = "Pulse Health — Connected Care"
description = "A 116-second animated product advertising film demonstrating Pulse Health workflows for patients, healthcare providers, and institutes, with synchronized English narration, music, sound design, and realistic app interactions."
version = "1.0.0"
id = "artifacts/pulse-health-ad"
router = "path"

[[services]]
name = "web"
paths = [ "/pulse-health-ad/" ]
localPort = 26016

[services.development]
run = "pnpm --filter @workspace/pulse-health-ad run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/pulse-health-ad", "run", "build" ]
serve = "static"
publicDir = "artifacts/pulse-health-ad/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "26016"
BASE_PATH = "/pulse-health-ad/"
