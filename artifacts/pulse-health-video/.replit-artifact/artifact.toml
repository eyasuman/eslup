kind = "video"
previewPath = "/pulse-health-video/"
title = "Pulse Health — Connected Care"
description = "A 116-second animated product advertising film demonstrating Pulse Health workflows for patients, healthcare providers, and institutes, with synchronized English narration, music, sound design, and realistic app interactions."
videoAspectRatio = "9:19.5"
router = "path"

[[services]]
localPort = 5173
name = "video"
paths = [ "/pulse-health-video/" ]

[services.development]
run = "pnpm --filter @workspace/pulse-health-video run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/pulse-health-video", "run", "build" ]
serve = "static"
publicDir = "artifacts/pulse-health-video/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "5173"
BASE_PATH = "/pulse-health-video/"
