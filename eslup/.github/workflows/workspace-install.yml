name: Workspace install

on:
  pull_request:
    paths:
      - "package.json"
      - "**/package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "scripts/**"
      - ".github/workflows/workspace-install.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workspace-install:
    name: workspace-install
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Test dependency failure diagnostics
        run: pnpm run test:validate-dependencies

      - name: Validate frozen workspace install
        run: pnpm run validate:dependencies
